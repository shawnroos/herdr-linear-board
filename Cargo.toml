[workspace]
resolver = "2"
members = [
    "crates/board-core",
    "crates/board-herdr",
    "crates/board-tui",
    "crates/board-daemon",
    "crates/board-cli",
]

[workspace.package]
version = "0.17.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Ids / cli / errors
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"

# Async runtime: the daemon, and `board mcp` in board-cli (rmcp requires tokio)
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "process",
    "signal",
    "io-util",
    "macros",
] }

# TUI
ratatui = "0.28"
crossterm = "0.28"
tui-textarea = "0.6"
unicode-width = "0.1"

# Paths / logging
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
libc = "0.2"
base64 = "0.22"

# `board mcp`: the official MCP SDK over stdio, and the schema derive its tool
# parameters need.
rmcp = { version = "3.5", features = ["transport-io"] }
schemars = "1"

# Linear GraphQL (daemon only). rustls with the ring provider: aws-lc-sys wants
# cmake, which the sandbox image does not carry.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Dev / test
insta = "1"
tempfile = "3"
sha2 = "0.10"

# Internal crates
board-core = { path = "crates/board-core" }
board-herdr = { path = "crates/board-herdr" }
board-tui = { path = "crates/board-tui" }
board-daemon = { path = "crates/board-daemon" }
board-cli = { path = "crates/board-cli" }
